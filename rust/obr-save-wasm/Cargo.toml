[package]
name = "obr-save-wasm"
version = "0.1.0"
edition = "2021"
description = "Save-chunk decompressor for OBR Quest Companion"
license = "MIT"
repository = "https://github.com/codeblivion/OBRQuestCompanion"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oozextract = { version = "=0.5.5", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
